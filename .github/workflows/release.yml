name: Release

# Publishes the library when a material-v<version> tag is pushed (upstream-land.yml
# pushes it after merging a port; a maintainer may push one by hand). Each library
# crate whose version is not on crates.io yet is published, the color crate first,
# with the CARGO_REGISTRY_TOKEN secret; then a GitHub release is made from
# CHANGELOG.md. docs/RELEASING.md has the checks a release must pass before this.

on:
  push:
    tags: ["material-v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain and Linux libraries
        run: |
          rustup toolchain install
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev
      - name: Check the tag names the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "gpui-kit-material") | .version')
          if [ "$TAG" != "material-v$version" ]; then
            echo "::error::$TAG does not match gpui-kit-material $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for crate in gpui-kit-material-color gpui-kit-material; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "$GITHUB_REPOSITORY release" \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = 200 ]; then
              echo "$crate $version is already published."
            else
              cargo publish --locked -p "$crate"
            fi
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The CHANGELOG section for this version, without its heading.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "gpui-kit-material " v " ")) { found = 1; next } }
            found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --title "gpui-kit-material $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
